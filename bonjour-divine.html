<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bonjour DIVINE 🌹 mon tout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#080820;
    --cream:#fff4ea;
    --blush:#ffd9e4;
    --gold:#ffe3a8;
    --bar:min(8vh,64px);
    color-scheme: dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--night);overflow:hidden;-webkit-tap-highlight-color:transparent}
  body{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;color:var(--cream)}

  /* ---------- Monde ---------- */
  #world{
    position:fixed;inset:0;background:var(--night);
    filter:blur(0);transition:filter 6.5s ease-out;
  }
  body:not(.playing) #world{filter:blur(16px)}
  #camera{position:absolute;inset:0;transform-origin:50% 60%;animation:push 175s linear forwards}
  @keyframes push{from{transform:scale(1)}to{transform:scale(1.09)}}
  #sky{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ---------- Effets ---------- */
  #vignette{
    position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 52%, rgba(60,10,60,.6) 100%);
  }
  #scrim{
    position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(ellipse 72% 48% at 50% 48%, rgba(110,25,80,.34), transparent 70%);
  }
  #beat{
    position:fixed;inset:0;pointer-events:none;opacity:0;z-index:2;
    background:radial-gradient(circle at 50% 50%, rgba(255,90,140,.36), rgba(255,90,140,0) 62%);
  }
  #beat.on{animation:lubdub 1s ease-out infinite}
  @keyframes lubdub{
    0%{opacity:0;transform:scale(.92)}
    10%{opacity:1;transform:scale(1.03)}
    22%{opacity:.15;transform:scale(.98)}
    36%{opacity:.8;transform:scale(1.02)}
    62%,100%{opacity:0;transform:scale(.95)}
  }
  #flash{
    position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;
    background:radial-gradient(circle at 50% 60%, rgba(255,243,215,.95), rgba(255,190,160,.45) 55%, transparent 85%);
  }
  #flash.go{animation:flash 4.5s ease-out}
  @keyframes flash{0%{opacity:0}14%{opacity:.6}100%{opacity:0}}
  #grain{
    position:fixed;inset:-50%;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation:grain .9s steps(6) infinite;
  }
  @keyframes grain{
    0%{transform:translate(0,0)}20%{transform:translate(-4%,3%)}40%{transform:translate(3%,-5%)}
    60%{transform:translate(-6%,-2%)}80%{transform:translate(5%,4%)}100%{transform:translate(0,0)}
  }
  /* paupières : les yeux s'ouvrent au début, grand ouverts à la fin */
  .bar{
    position:fixed;left:0;right:0;height:50.5vh;background:#000;z-index:5;
    transition:height 6.5s cubic-bezier(.2,.6,.2,1);
  }
  .bar.top{top:0}.bar.bottom{bottom:0}
  body.playing .bar{height:var(--bar)}
  body.wide .bar{height:0;transition:height 9s ease-in-out}

  /* ---------- Texte ---------- */
  #stage{
    position:fixed;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;
    padding:12vh 7vw;text-align:center;pointer-events:none;
  }
  .line{
    position:absolute;max-width:min(92vw,900px);
    transition:opacity 1.8s ease, filter 1.8s ease, transform 2.6s ease;
  }
  .line.out{opacity:0;filter:blur(10px);transform:translateY(-18px) scale(1.03)}
  .w{
    display:inline-block;margin:0 .14em;
    opacity:0;filter:blur(14px);transform:translateY(18px) scale(.96);
    animation:wordIn 1.9s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @keyframes wordIn{to{opacity:1;filter:blur(0);transform:none}}
  .nw{display:inline-block;white-space:nowrap}

  .soft{
    font-style:italic;font-weight:300;
    font-size:clamp(1.7rem,6.2vw,3.1rem);line-height:1.38;color:var(--cream);
    text-shadow:0 1px 3px rgba(100,25,70,.5),0 0 22px rgba(255,110,150,.8),0 2px 28px rgba(120,30,80,.6);
  }
  .script,.hand{
    font-family:'Great Vibes','Snell Roundhand','Apple Chancery','Brush Script MT',cursive;
    color:#fff;line-height:1.1;
    text-shadow:0 1px 4px rgba(110,25,75,.55),0 0 22px rgba(255,120,150,.9),0 0 60px rgba(255,110,140,.65);
  }
  .script{font-size:clamp(3.6rem,17vw,9rem)}
  .script.sm{font-size:clamp(3rem,13vw,7rem)}
  .script.fin{font-size:clamp(2.8rem,12vw,6rem)}
  .hand{font-size:clamp(2.1rem,8.5vw,4.2rem);color:var(--cream)}
  .hand.mini{font-size:clamp(1.5rem,5.6vw,2.5rem);margin:.15em 0}
  .name{
    font-weight:500;letter-spacing:.2em;
    font-size:clamp(2.6rem,13vw,7.2rem);line-height:1.12;padding-left:.2em;
  }
  .name.sm{font-size:clamp(2.1rem,10vw,5rem);letter-spacing:.18em;padding-left:.18em}
  .name.tiny{font-size:clamp(1.3rem,5.4vw,2.6rem);letter-spacing:.3em;padding-left:.3em}
  .name .w{
    margin:0;animation-name:nameIn;
    background:linear-gradient(180deg,#fffdf8 0%,#fff0cc 55%,#ffcf9a 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 12px rgba(130,30,85,.65)) drop-shadow(0 0 28px rgba(255,150,150,.7));
  }
  @keyframes nameIn{
    from{opacity:0;transform:translateY(24px) scale(.9);letter-spacing:.6em}
    to{opacity:1;transform:none}
  }
  .name.pulse{animation:glowPulse 4s ease-in-out infinite}
  @keyframes glowPulse{
    0%,100%{filter:drop-shadow(0 0 8px rgba(255,150,150,.4))}
    50%{filter:drop-shadow(0 0 32px rgba(255,170,160,.95))}
  }
  .final-heart{
    display:block;font-size:clamp(1.8rem,7vw,3rem);margin-top:.3em;
    animation:beat 1.6s ease-in-out infinite;text-shadow:0 0 24px rgba(255,100,150,.95);
  }
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}45%{transform:scale(1.15)}}

  /* ---------- Écran de départ + boutons ---------- */
  #intro{
    position:fixed;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;
    background:radial-gradient(circle at 50% 70%, rgba(95,28,92,.96), rgba(8,8,32,.99));
    transition:opacity 2.4s ease, visibility 2.4s;padding:2rem;text-align:center;
  }
  #intro.gone{opacity:0;visibility:hidden;pointer-events:none}
  #intro .t{
    font-family:'Great Vibes','Snell Roundhand','Apple Chancery',cursive;
    font-size:clamp(3.2rem,15vw,6rem);color:#fff;line-height:1.1;
    text-shadow:0 0 20px rgba(255,130,160,.95),0 0 60px rgba(255,100,140,.65);
  }
  #intro p{
    font-style:italic;font-weight:300;font-size:clamp(1.2rem,4.5vw,1.7rem);
    color:var(--blush);max-width:21em;line-height:1.5;
  }
  #start{
    all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;
    width:112px;height:112px;border-radius:50%;font-size:3rem;margin-top:.4rem;
    background:radial-gradient(circle at 35% 30%, #ffc2d6, #ff6f9c 55%, #e0405f 100%);
    box-shadow:0 0 0 0 rgba(255,120,160,.6),0 0 50px rgba(255,110,150,.7);
    animation:ring 2.2s ease-out infinite, beat 1.6s ease-in-out infinite;
  }
  #start:focus-visible,.ctl:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
  @keyframes ring{to{box-shadow:0 0 0 38px rgba(255,120,160,0),0 0 50px rgba(255,110,150,.7)}}
  #intro small{font-size:1rem;color:rgba(255,244,234,.65);font-style:italic}

  .ctl{
    all:unset;cursor:pointer;position:fixed;z-index:10;
    color:var(--cream);font-size:1.05rem;font-style:italic;
    padding:.55rem 1.1rem;border-radius:999px;border:1px solid rgba(255,220,225,.45);
    background:rgba(80,20,70,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:opacity 1.2s ease, background .3s;
  }
  .ctl:hover{background:rgba(255,130,160,.3)}
  #mute{top:calc(var(--bar) + 12px);right:14px;opacity:0;pointer-events:none}
  body.playing #mute{opacity:.9;pointer-events:auto}
  #replay{left:50%;bottom:4vh;transform:translateX(-50%);opacity:0;pointer-events:none;z-index:11;white-space:nowrap}
  #replay.show{opacity:1;pointer-events:auto}

  @media (prefers-reduced-motion: reduce){
    #camera,#grain,#flash.go,#beat.on{animation:none}
    #world{transition:none}
  }
</style>
</head>
<body>

<div id="world"><div id="camera"><canvas id="sky" aria-hidden="true"></canvas></div></div>
<div id="vignette"></div>
<div id="scrim"></div>
<div id="beat"></div>
<div id="flash"></div>
<div id="grain"></div>
<div class="bar top"></div>
<div class="bar bottom"></div>

<main id="stage" aria-live="polite"></main>

<button class="ctl" id="mute" aria-label="Couper ou remettre la musique">♪ musique</button>
<button class="ctl" id="replay">revivre ce matin 🌹</button>

<div id="intro">
  <div class="t">Pour toi, DIVINE</div>
  <p>Ce matin, le soleil se lève rien que pour toi…<br>mets le son, ouvre les yeux, et laisse-toi aimer.</p>
  <button id="start" aria-label="Commencer">🌹</button>
  <small>touche la rose</small>
</div>

<script>
(() => {
  const cv = document.getElementById('sky');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, DPR, horizonY;
  let stars = [], dust = [], bokeh = [], hearts = [], shooters = [], clouds = [], glit = [];
  let birds = [], butterflies = [], petals = [], hp = [];
  let intensity = .6, playing = false, clockStart = null;
  let birdsOn = false, nextBird = 0, butterOn = false, nextButter = 0, petalRate = 0;
  const HV = { v: 0, t: 0, t0: 0, beat: false };
  const HEART_COLORS = ['#ff8fb1', '#ff5c8a', '#ffc2d4', '#ffd28a', '#fff0c8', '#ff7aa2'];
  const PETAL_COLORS = ['#ff7aa2', '#ff4f81', '#ffb0c6', '#e0345f', '#ffd0dc', '#ffe3ea'];
  const BUTTER_COLORS = ['#ffb3c8', '#ffd28a', '#fff0c8', '#ff8fb1'];

  /* ---------- Outils couleur ---------- */
  const lerp = (a, b, t) => a + (b - a) * t;
  const ss = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
  const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
  const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  function kf(frames, p){
    for (let i = 1; i < frames.length; i++){
      if (p <= frames[i][0]){
        const [p0, c0] = frames[i - 1], [p1, c1] = frames[i];
        return mixc(c0, c1, (p - p0) / (p1 - p0));
      }
    }
    return frames[frames.length - 1][1];
  }
  // 0 = nuit profonde, 1 = matin rose et or
  const SKY_TOP = [[0,[8,8,32]],[.22,[40,24,88]],[.45,[96,70,150]],[.7,[132,150,225]],[1,[120,150,228]]];
  const SKY_MID = [[0,[20,16,56]],[.22,[120,56,128]],[.45,[240,128,164]],[.7,[255,176,170]],[1,[255,186,170]]];
  const SKY_HOR = [[0,[44,26,80]],[.22,[230,100,150]],[.45,[255,162,120]],[.7,[255,204,130]],[1,[255,222,160]]];
  const CLOUD   = [[0,[70,50,120]],[.3,[240,120,165]],[.55,[255,175,150]],[1,[255,232,225]]];

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    horizonY = H * .68;
    const n = Math.round(Math.min(260, W * H / 5200));
    stars = Array.from({length: n}, () => ({
      x: Math.random() * W, y: Math.random() * horizonY * .95,
      r: Math.random() * 1.3 + .25, p: Math.random() * 6.28, s: Math.random() * 1.6 + .5
    }));
    dust = Array.from({length: reduce ? 20 : 55}, () => ({
      x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.7 + .5,
      vx: (Math.random() - .5) * 6, vy: -(Math.random() * 10 + 3), p: Math.random() * 6.28
    }));
    bokeh = Array.from({length: reduce ? 8 : 26}, () => ({
      x: Math.random() * W, y: Math.random() * H, r: Math.random() * 28 + 10,
      vy: -(Math.random() * 6 + 2), vx: (Math.random() - .5) * 4,
      a: Math.random() * .07 + .04, p: Math.random() * 6.28, h: Math.random() < .4
    }));
    clouds = Array.from({length: 8}, () => {
      const n = 6 + (Math.random() * 5 | 0), s = Math.random() * 60 + 60, blobs = [];
      for (let j = 0; j < n; j++) blobs.push({
        dx: (j - n / 2) * s * .55 + (Math.random() - .5) * s * .3,
        dy: (Math.random() - .5) * s * .3, r: s * (.5 + Math.random() * .55)
      });
      return { x: Math.random() * (W + 600) - 300, y: H * (.07 + Math.random() * .43),
               sp: Math.random() * 6 + 3, a: Math.random() * .22 + .26, blobs };
    });
    glit = Array.from({length: reduce ? 70 : 170}, () => ({
      u: Math.random(), v: Math.random(), l: Math.random(), p: Math.random() * 6.28
    }));
    // cœur de lumière : particules qui dessinent un cœur
    const cnt = W < 600 ? 170 : 280, k = Math.min(W * .42, H * .36) / 17, cy = H / 2 - 2.5 * k;
    hp = [];
    for (let i = 0; i < cnt; i++){
      const t = Math.random() * Math.PI * 2;
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      const sc = Math.random() < .74 ? 1 + (Math.random() - .5) * .05 : Math.sqrt(Math.random()) * .92;
      hp.push({
        tx: W / 2 + x * k * sc, ty: cy - y * k * sc,
        sx: Math.random() * W, sy: H * (.78 + Math.random() * .3),
        ph: Math.random() * 6.28, d: Math.random() * .5, r: Math.random() * 1.7 + .8, hue: Math.random()
      });
    }
    hpK = k;
  }
  let hpK = 1;
  addEventListener('resize', resize); resize();

  function heartPath(c, x, y, s){
    c.beginPath();
    c.moveTo(x, y + s*.3);
    c.bezierCurveTo(x, y - s*.2, x - s, y - s*.2, x - s, y + s*.35);
    c.bezierCurveTo(x - s, y + s*.8, x, y + s, x, y + s*1.25);
    c.bezierCurveTo(x, y + s, x + s, y + s*.8, x + s, y + s*.35);
    c.bezierCurveTo(x + s, y - s*.2, x, y - s*.2, x, y + s*.3);
    c.closePath();
  }
  function spawnHeart(x, y, big){
    hearts.push({
      x: x ?? Math.random() * W, y: y ?? H + 30,
      s: (Math.random() * 11 + 6) * (big ? 1.3 : 1),
      vy: -(Math.random() * 38 + 26), vx: (Math.random() - .5) * 10,
      sway: Math.random() * 22 + 8, ph: Math.random() * 6.28,
      a: Math.random() * .4 + .5, c: HEART_COLORS[(Math.random() * HEART_COLORS.length) | 0]
    });
  }
  function burst(n){
    if (reduce) n = Math.round(n / 3);
    for (let i = 0; i < n; i++){
      setTimeout(() => spawnHeart(W * (.1 + Math.random() * .8), H * (.6 + Math.random() * .45)), i * 55);
    }
  }
  function shoot(){
    shooters.push({
      x: Math.random() * W * .8 + W * .15, y: Math.random() * H * .3,
      vx: -(Math.random() * 300 + 380), vy: Math.random() * 120 + 160,
      life: 0, max: .9 + Math.random() * .4
    });
  }
  function spawnFlock(){
    const n = 3 + (Math.random() * 3 | 0), y0 = H * (.14 + Math.random() * .28), dir = Math.random() < .5 ? 1 : -1;
    const sp = (Math.random() * 20 + 38) * dir, ph = Math.random() * 6.28;
    for (let i = 0; i < n; i++){
      birds.push({
        x: (dir > 0 ? -40 : W + 40) - dir * i * 26, y: y0 + i * 12 * (i % 2 ? 1 : -1) + Math.random() * 10,
        vx: sp * (.92 + Math.random() * .16), s: Math.random() * 5 + 8, ph: ph + i * .6, bob: Math.random() * 6.28
      });
    }
  }
  function spawnButterfly(){
    const side = Math.random() < .5;
    butterflies.push({
      x: side ? -20 : W + 20, y: H * (.3 + Math.random() * .4),
      a: side ? 0 : Math.PI, sp: Math.random() * 20 + 30, s: Math.random() * 5 + 8,
      ph: Math.random() * 6.28, wob: Math.random() * 6.28,
      c: BUTTER_COLORS[(Math.random() * BUTTER_COLORS.length) | 0]
    });
  }
  function spawnPetal(y){
    petals.push({
      x: Math.random() * (W + 200) - 100, y: y ?? -20, s: Math.random() * 6 + 6,
      vy: Math.random() * 36 + 34, vx: (Math.random() - .3) * 16,
      r: Math.random() * 6.28, vr: (Math.random() - .5) * 2.2,
      f: Math.random() * 6.28, vf: Math.random() * 2.2 + 1,
      a: Math.random() * .25 + .7, c: PETAL_COLORS[(Math.random() * PETAL_COLORS.length) | 0]
    });
  }

  /* ---------- Dessin ---------- */
  function drawMoon(P){
    const a = 1 - P * 3.6; if (a <= .01) return;
    const mx = W * .2, my = H * .2 + P * H * .2, mr = Math.min(W, H) * .055;
    ctx.save(); ctx.globalAlpha = a;
    let g = ctx.createRadialGradient(mx, my, mr * .6, mx, my, mr * 6);
    g.addColorStop(0, 'rgba(255,232,214,.35)'); g.addColorStop(1, 'rgba(255,170,200,0)');
    ctx.fillStyle = g; ctx.fillRect(mx - mr * 6, my - mr * 6, mr * 12, mr * 12);
    g = ctx.createRadialGradient(mx - mr * .3, my - mr * .3, mr * .1, mx, my, mr);
    g.addColorStop(0, '#fffaf0'); g.addColorStop(1, '#f7d9c4');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(mx, my, mr, 0, 6.283); ctx.fill();
    ctx.restore();
  }

  function drawClouds(P, dt, sx, sy){
    const base = kf(CLOUD, P);
    for (const c of clouds){
      c.x += c.sp * dt;
      if (c.x > W + 340) c.x = -340;
      const warm = Math.max(0, 1 - Math.hypot(c.x - sx, c.y - sy) / (W * .7)) * ss(P * 1.6);
      const col = mixc(base, [255, 205, 140], warm * .8);
      for (const b of c.blobs){
        const gx = c.x + b.dx, gy = c.y + b.dy;
        ctx.save();
        ctx.translate(gx, gy); ctx.scale(1, .55);
        const g = ctx.createRadialGradient(0, 0, 0, 0, 0, b.r);
        g.addColorStop(0, rgb(col, c.a)); g.addColorStop(1, rgb(col, 0));
        ctx.fillStyle = g; ctx.fillRect(-b.r, -b.r, b.r * 2, b.r * 2);
        ctx.restore();
      }
    }
  }

  function drawBird(b, now){
    const f = Math.sin(now * .012 + b.ph) * b.s * .42;
    ctx.beginPath();
    ctx.moveTo(b.x - b.s, b.y - f);
    ctx.quadraticCurveTo(b.x - b.s * .45, b.y - b.s * .55 + f * .5, b.x, b.y);
    ctx.quadraticCurveTo(b.x + b.s * .45, b.y - b.s * .55 + f * .5, b.x + b.s, b.y - f);
    ctx.stroke();
  }

  function drawButterfly(b, now){
    const f = .25 + .75 * Math.abs(Math.sin(now * .014 + b.ph)), s = b.s;
    ctx.save();
    ctx.translate(b.x, b.y); ctx.rotate(b.a + Math.PI / 2);
    ctx.fillStyle = b.c; ctx.shadowColor = b.c; ctx.shadowBlur = 10;
    ctx.globalAlpha = .92;
    ctx.beginPath(); ctx.ellipse(-s * f * .55, -s * .25, s * f * .6, s * .55, -.4, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse( s * f * .55, -s * .25, s * f * .6, s * .55,  .4, 0, 6.283); ctx.fill();
    ctx.globalAlpha = .75;
    ctx.beginPath(); ctx.ellipse(-s * f * .4, s * .35, s * f * .4, s * .35,  .4, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse( s * f * .4, s * .35, s * f * .4, s * .35, -.4, 0, 6.283); ctx.fill();
    ctx.shadowBlur = 0; ctx.globalAlpha = .85;
    ctx.fillStyle = 'rgba(100,40,70,.9)'; ctx.fillRect(-.7, -s * .5, 1.4, s * 1.1);
    ctx.restore();
  }

  function drawPetal(p){
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.scale(1, .55 + .45 * Math.abs(Math.sin(p.f)));
    ctx.globalAlpha = p.a * Math.min(1, (H - p.y + 40) / 120);
    ctx.fillStyle = p.c; ctx.shadowColor = p.c; ctx.shadowBlur = 6;
    const s = p.s;
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.bezierCurveTo(s * .95, -s * .6, s * .8, s * .75, 0, s);
    ctx.bezierCurveTo(-s * .8, s * .75, -s * .95, -s * .6, 0, -s);
    ctx.fill();
    ctx.restore();
  }

  function drawHeartParticles(now){
    HV.v += (HV.t - HV.v) * Math.min(1, .05);
    if (HV.v < .01 || !hp.length) return;
    const prog = Math.min(1, (now - HV.t0) / 9000);
    let sc = 1;
    if (HV.beat && prog > .9){
      const ph = (now % 1000) / 1000;
      sc += .035 * (Math.exp(-Math.pow((ph - .1) / .06, 2)) + .7 * Math.exp(-Math.pow((ph - .38) / .06, 2)));
    }
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.translate(W / 2, H / 2); ctx.scale(sc, sc); ctx.translate(-W / 2, -H / 2);
    const halo = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, hpK * 19);
    halo.addColorStop(0, `rgba(255,100,150,${.2 * prog * HV.v})`); halo.addColorStop(1, 'rgba(255,100,150,0)');
    ctx.fillStyle = halo; ctx.fillRect(0, 0, W, H);
    for (const p of hp){
      const e = ss((prog - p.d * .55) / .5);
      let x = lerp(p.sx, p.tx, e), y = lerp(p.sy, p.ty, e);
      const sw = (1 - e) * 70;
      x += Math.sin(now * .003 + p.ph) * sw * .6; y += Math.cos(now * .0027 + p.ph) * sw * .4;
      if (e >= 1){ x += Math.sin(now * .0015 + p.ph) * 1.6; y += Math.cos(now * .0013 + p.ph) * 1.6; }
      const tw = .55 + .45 * Math.sin(now * .004 + p.ph * 3);
      const col = mixc([255, 214, 150], [255, 120, 170], p.hue);
      const al = HV.v * (.35 + .65 * e);
      ctx.fillStyle = rgb(col, .8 * tw * al);
      ctx.beginPath(); ctx.arc(x, y, p.r * (1 + e * .3), 0, 6.283); ctx.fill();
      ctx.fillStyle = rgb(col, .12 * al);
      ctx.beginPath(); ctx.arc(x, y, p.r * 3.8, 0, 6.283); ctx.fill();
    }
    ctx.restore();
  }

  let last = performance.now(), nextShoot = 3500, heartAcc = 0, petAcc = 0;
  function frame(now){
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const T = clockStart == null ? 0 : (now - clockStart) / 1000;
    const P = ss((T - 5) / 118);               // avancée de l'aube

    ctx.globalCompositeOperation = 'lighter';
    const R1 = r * (5 + 9 * P) + H * .15 * Math.min(1, P * 3);

        ctx.fillStyle = rg;

      const sr = r * (1 + .02 * Math.sin(now * .002));

    ctx.globalCompositeOperation = 'lighter';
    for (const q of glit){
      const y = horizonY + Math.pow(q.v, 1.7) * (H - horizonY);
      const depth = (y - horizonY) / (H - horizonY);
      const hw = 14 + depth * W * .2;
      const x = sx + (q.u - .5) * 2 * hw;
      const len = (8 + q.l * 34) * (.5 + depth * 1.1);
      const a = refl * (.15 + .65 * Math.max(0, Math.sin(now * .0025 + q.p))) * (1 - depth * .35);
      if (a < .02) continue;
      ctx.fillStyle = `rgba(255,232,190,${a})`;
      ctx.fillRect(x - len / 2, y, len, 1.2 + depth * 1.8);
    }

      [[.35,.22],[.7,.12],[1.15,.3],[1.6,.16]].forEach(([k, s], i) => {

        const fr = r * s * 3;

      const a = .25 + .35 * Math.sin(now * .002 + d.p);
      ctx.fillStyle = `rgba(255,228,180,${Math.max(0, a)})`;

    if (butterOn && !reduce){

    }
    for (let i = butterflies.length - 1; i >= 0; i--){
      const b = butterflies[i];
      b.a += Math.sin(now * .0011 + b.wob) * 1.6 * dt;
      b.x += Math.cos(b.a) * b.sp * dt; b.y += Math.sin(b.a) * b.sp * dt - 6 * dt * Math.sin(now * .004 + b.ph);
      if (b.x < -60 || b.x > W + 60 || b.y < -60 || b.y > H + 60){ butterflies.splice(i, 1); continue; }
      drawButterfly(b, now);
    }

    // pétales de rose
    petAcc += dt * petalRate * (1.4 + W / 800) * (reduce ? .4 : 1);
    if (petAcc > 1 && petals.length < 95){ petAcc = 0; spawnPetal(); }
    for (let i = petals.length - 1; i >= 0; i--){
      const p = petals[i];
      p.y += p.vy * dt; p.x += (p.vx + Math.sin(now * .0011 + p.f) * 22) * dt;
      p.r += p.vr * dt; p.f += p.vf * dt;
      if (p.y > H + 30){ petals.splice(i, 1); continue; }
      drawPetal(p);
    }

    // cœurs qui s'envolent
    heartAcc += dt * intensity;
    if (heartAcc > .6){ heartAcc = 0; spawnHeart(); }
    ctx.save();
    for (let i = hearts.length - 1; i >= 0; i--){
      const h = hearts[i];
      h.y += h.vy * dt;
      h.x += h.vx * dt + Math.sin(now * .0012 + h.ph) * h.sway * dt;
      const fade = Math.min(1, Math.max(0, h.y / (H * .3)));
      if (h.y < -40){ hearts.splice(i, 1); continue; }
      ctx.globalAlpha = h.a * fade;
      ctx.shadowColor = h.c; ctx.shadowBlur = 16;
      ctx.fillStyle = h.c;
      heartPath(ctx, h.x, h.y, h.s); ctx.fill();
    }
    ctx.restore();

    // étoiles filantes (dans la nuit)
    nextShoot -= dt * 1000;
    if (nextShoot < 0 && !reduce && starA > .4){ shoot(); nextShoot = 4500 + Math.random() * 4000; }
    for (let i = shooters.length - 1; i >= 0; i--){
      const s = shooters[i];
      s.life += dt; s.x += s.vx * dt; s.y += s.vy * dt;
      const k = (1 - s.life / s.max) * starA;
      if (k <= 0){ shooters.splice(i, 1); continue; }
      const tx = s.x - s.vx * .12, ty = s.y - s.vy * .12;
      const sg = ctx.createLinearGradient(s.x, s.y, tx, ty);
      sg.addColorStop(0, `rgba(255,255,255,${k})`); sg.addColorStop(1, 'rgba(255,170,200,0)');
      ctx.strokeStyle = sg; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(tx, ty); ctx.stroke();
    }
    requestAnimationFrame(frame);
  }

  function tone(type, f, t, attack, peak, dur, dest){
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); g.connect(dest || master);
    o.start(t); o.stop(t + dur + .1);
  }
  function playChord(){

    chordIdx++;
    tone('sine', ch.bass, t0, .4, .3, CH + .4);
    ch.pad.forEach(f => {
      const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1000;
      lp.connect(master);
      tone('triangle', f, t0, 1.8, .07, CH + .2, lp);
    });
    [0, 1, 2, 3, 2, 1, 2, 3].forEach((k, n) => tone('sine', ch.arp[k], t0 + n * NOTE, .012, .12, 1.6));

  function makeLine(step){
    const el = document.createElement('div');
    if (step.cls === 'custom'){ el.className = 'line'; el.innerHTML = step.html; return el; }
    el.className = 'line ' + step.cls;
    step.txt.split(' ').forEach((word, i) => {
      const s = document.createElement('span');
      s.className = 'w'; s.style.animationDelay = (i * .28) + 's';
      s.textContent = word;
      el.appendChild(s);
    });
    return el;
  }

  function later(fn, sec){ timers.push(setTimeout(fn, sec * 1000)); }

  function resetWorld(){
    birdsOn = false; birds = []; butterOn = false; butterflies = []; petals = []; petalRate = 0;
    HV.v = 0; HV.t = 0; HV.beat = false;
    beatEl.classList.remove('on');
    chirps(false);
  }

  function play(){
    stage.innerHTML = '';
    replay.classList.remove('show');
    document.body.classList.remove('wide');
    resetWorld();
    intensity = .6;
    clockStart = performance.now();
    SCRIPT.forEach(step => {
      later(() => {
        const el = makeLine(step);
        stage.appendChild(el);
        intensity = step.int;
        if (step.burst) burst(step.burst);
        if (step.petals !== undefined){
          if (petalRate === 0 && step.petals > 0) for (let i = 0; i < 18; i++) spawnPetal(Math.random() * H);
          petalRate = step.petals;
        }
        if (step.birds){ birdsOn = true; nextBird = 0; chirps(true); }
        if (step.butter){ butterOn = true; nextButter = 0; }
        if (step.flash){ flashEl.classList.remove('go'); void flashEl.offsetWidth; flashEl.classList.add('go'); }
        if (step.heart){ HV.t = 1; HV.t0 = performance.now(); }
        if (step.hv !== undefined) HV.t = step.hv;
        if (step.beat === true){ beatEl.classList.add('on'); HV.beat = true; }
        if (step.beat === false){ beatEl.classList.remove('on'); HV.beat = false; }
        if (step.hb) heartbeatSound(step.hb);
        if (step.wide) document.body.classList.add('wide');
        if (step.d > 0){
          later(() => { el.classList.add('out'); setTimeout(() => el.remove(), 2800); }, step.d);
        } else {
          later(() => replay.classList.add('show'), 12);
        }
      }, step.t);
    });
  }

  replay.addEventListener('click', () => {
    timers.forEach(clearTimeout); timers = [];
    replay.classList.remove('show');
    chirps(false);
    stage.querySelectorAll('.line').forEach(l => l.classList.add('out'));
    document.body.classList.remove('wide');
    setTimeout(() => { stage.innerHTML = ''; play(); }, 1800);
  });

  document.getElementById('start').addEventListener('click', () => {
    document.getElementById('intro').classList.add('gone');
    document.body.classList.add('playing');
    playing = true;
    startMusic();
    if (actx && actx.state === 'suspended') actx.resume();
    play();
  });
})();
